<style>
  :root{

<script>
"use strict";
/* =========================================================
   LỚP DỮ LIỆU (Data Layer)
   - Schema này giữ nguyên khi chuyển lên online (Supabase):
     mỗi bảng = 1 object store, mỗi bản ghi có id (uuid),
     created_at, updated_at theo ISO string.
   - Sau này chỉ cần thay FarmDB bằng lớp gọi API,
     giao diện không phải viết lại.
   ========================================================= */
const DB_NAME = "farm_app_db";
const DB_VERSION = 9;
const STORES = ["zones", "crops", "plantings", "seasons", "tasks", "inventory", "finances", "care_logs", "periods", "stock_ins", "photos", "special_trees", "harvests", "stock_checks", "workers", "work_logs", "worker_payments", "notes"];

const FarmDB = {
  db: null,
  open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        STORES.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: "id" }); });
      };
      // Nếu còn tab/cửa sổ TACHI FARM bản cũ đang mở, việc nâng cấp database sẽ bị treo chờ:
      // báo rõ lên góc phải để người dùng biết mà đóng các tab cũ, thay vì đứng ở trang trắng.
      req.onblocked = () => {
        const el = document.getElementById("syncStatus");
        if (el) el.textContent = "⚠ Hãy đóng hết các tab TACHI FARM cũ đang mở, rồi tải lại trang này";
      };
      req.onsuccess = () => {
        FarmDB.db = req.result;
        // Khi 1 tab khác mở bản mới hơn, tab này tự nhả database để tab mới nâng cấp được
        FarmDB.db.onversionchange = () => { try { FarmDB.db.close(); } catch {} };
        resolve();
      };
      req.onerror = () => reject(req.error);
    });
  },
  _tx(store, mode) { return FarmDB.db.transaction(store, mode).objectStore(store); },
  all(store) {
    return new Promise((resolve, reject) => {
      const out = []; const req = FarmDB._tx(store, "readonly").openCursor();
      req.onsuccess = () => { const c = req.result; if (c) { out.push(c.value); c.continue(); } else resolve(out); };
      req.onerror = () => reject(req.error);
    });
  },
  put(store, record) {
    return new Promise((resolve, reject) => {
      const now = new Date().toISOString();
      if (!record.id) { record.id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()); record.created_at = now; }
      record.updated_at = now;
      const req = FarmDB._tx(store, "readwrite").put(record);
      req.onsuccess = () => resolve(record); req.onerror = () => reject(req.error);
    });
  },
  remove(store, id) {
    return new Promise((resolve, reject) => {
      const req = FarmDB._tx(store, "readwrite").delete(id);
      req.onsuccess = () => resolve(); req.onerror = () => reject(req.error);
    });
  },
  clearAll() {
    return Promise.all(STORES.map(s => new Promise((res, rej) => {
      const req = FarmDB._tx(s, "readwrite").clear();
      req.onsuccess = res; req.onerror = () => rej(req.error);
    })));
  }
};

<script>
"use strict";
/* ===== Giao diện & điều hướng ===== */
const cache = { zones: [], crops: [], plantings: [], seasons: [], tasks: [], inventory: [], finances: [], care_logs: [], periods: [], stock_ins: [], photos: [], special_trees: [], harvests: [], stock_checks: [], workers: [], work_logs: [], worker_payments: [], notes: [] };
let currentView = "dashboard";
const APP_VERSION = "v2.30 (17/11/2026)";
let editing = null; // {store, id}

const VIEWS = [
  { id: "dashboard", title: "Tổng quan", icon: "🏠" },
  { id: "garden", title: "Nhập liệu", icon: "🌳" },
  { id: "care", title: "Nhật ký chăm sóc", icon: "📓" },
  { id: "special", title: "Cây đặc biệt", icon: "🩺" },

  { id: "inventory", title: "Kho vật tư", icon: "📦" },
  { id: "workers", title: "Nhân sự", icon: "👷" },
  { id: "finances", title: "Thu chi", icon: "💰" },
  { id: "notes", title: "Ghi chú", icon: "📝" },
  { id: "data", title: "Dữ liệu", icon: "💾" }
];
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtMoney = n => Number(n || 0).toLocaleString("vi-VN") + " đ";
function parseVN(v) {
  if (v === "" || v === null || v === undefined) return "";
  let t = String(v).trim().replace(/\s/g, "");
  if (!t) return "";
  // Phân số kiểu 1/2, 1/3, 1/4 (dùng cho ô số lượng khi chỉ dùng 1 phần gói/chai)
  const fr = t.match(/^(\d+(?:[.,]\d+)?)\/(\d+(?:[.,]\d+)?)$/);
  if (fr) { const a = parseVN(fr[1]), b = parseVN(fr[2]); return (a !== "" && b) ? a / b : ""; }
  const hasDot = t.includes("."), hasComma = t.includes(",");
  if (hasDot && hasComma) {
    // Cả 2 dấu: dấu nào đứng sau là dấu thập phân. VD 1.234,56 (VN) hoặc 1,234.56 (US)
    if (t.lastIndexOf(",") > t.lastIndexOf(".")) t = t.replace(/\./g, "").replace(",", ".");
    else t = t.replace(/,/g, "");
  } else if (hasComma) {
    // Phẩy đứng trước nhóm đúng 3 chữ số = dấu phân cách nghìn: 2,600 -> 2600; 1,234,567 -> 1234567
    // Ngoài ra phẩy là dấu thập phân kiểu VN: 2,5 -> 2.5; 12,34 -> 12.34
    if (/^-?\d{1,3}(,\d{3})+$/.test(t)) t = t.replace(/,/g, "");
    else t = t.replace(",", ".");
  } else if (hasDot) {
    // Chấm theo nhóm 3 chữ số = phân cách nghìn: 45.000 -> 45000; còn lại là thập phân: 2.5
    if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");
  }
  const n = Number(t);
  return isNaN(n) ? "" : n;
}
function fmtNumInput(v) {
  if (v === "" || v === null || v === undefined) return "";
  const n = Number(v);
  return isNaN(n) ? String(v) : n.toLocaleString("vi-VN");
}

// Đọc theo cách này để không bị nhiễu bởi trạng thái gõ dở giữa chừng (VD đang gõ 129.500 thì ô tạm là "12.9500").

      <input class="wk-unit" type="text" value="kg" style="width:56px;padding:9px;border:1px solid var(--border);border-radius:10px">

    </span>

function wkCalc(row) {
  const mode = row.querySelector(".wk-mode").value;
  if (mode === "piece") {
    const qty = parseVN(row.querySelector(".wk-qty").value);
    const pr = moneyVal(row.querySelector(".wk-prate"));
    if (qty === "" || !(qty > 0) || !(pr > 0)) return null;
    return { mode, qty, unit: row.querySelector(".wk-unit").value || "kg", piece_rate: pr, amount: Math.round(qty * pr) };
  }
  const days = parseFloat(row.querySelector(".wk-days").value);
  const rate = moneyVal(row.querySelector(".wk-rate"));
  if (!(rate > 0)) return null;
  return { mode, days, rate, amount: Math.round(days * rate) };
}
function wkRowAmt(el) {
  const row = el.closest(".wk-row"); if (!row) return;
  const c = row.querySelector(".wk-on").checked ? wkCalc(row) : null;
  row.querySelector(".wk-amt").textContent = c ? fmtMoney(c.amount) : "";
}
function wkModeToggle(sel) {
  const row = sel.closest(".wk-row"); if (!row) return;
  const piece = sel.value === "piece";
  row.querySelector(".wk-day-in").style.display = piece ? "none" : "inline-flex";
  const pi = row.querySelector(".wk-piece-in");
  pi.style.display = piece ? "inline-flex" : "none";
  wkRowAmt(sel);
}

async function deleteWorker(id) {

let inventoryQuery = "";

const INV_CAT_ORDER = ["Phân bón", "Thuốc", "Dụng cụ", "Giống", "Thức ăn", "Khác"];
const INV_CAT_ICONS = { "Phân bón": "🌿", "Thuốc": "💊", "Dụng cụ": "🛠️", "Giống": "🌱", "Thức ăn": "🥣", "Khác": "📦" };
function invBucket(r) { return (r.category || "").trim() || "Khác"; }
function invCatIdx(b) { const i = INV_CAT_ORDER.indexOf(b); return i < 0 ? INV_CAT_ORDER.length : i; }
function setInventoryCat(cat) {
  inventoryCat = cat || "";
  document.querySelectorAll(".cat-chip").forEach(b => b.classList.toggle("active", (b.dataset.cat || "") === inventoryCat));
  applyInventoryFilters();
}
function applyInventoryFilters() {
  const needle = searchKey(inventoryQuery.trim());
  const trs = document.querySelectorAll("#invTableBody tr[data-search]");
  let visible = 0; const groupVisible = {};
  trs.forEach(tr => {
    const show = (!needle || tr.dataset.search.includes(needle)) && (!inventoryCat || tr.dataset.cat === inventoryCat);
    tr.style.display = show ? "" : "none";
    if (show) { visible++; groupVisible[tr.dataset.cat] = true; }
  });
  document.querySelectorAll("#invTableBody tr.inv-group").forEach(gr => { gr.style.display = groupVisible[gr.dataset.group] ? "" : "none"; });
  const nr = document.getElementById("invNoResult");
  if (nr) nr.style.display = (visible || !trs.length) ? "none" : "";
  const cnt = document.getElementById("invSearchCount");
  if (cnt) cnt.textContent = (needle || inventoryCat) ? "Đang hiện " + visible + " / " + trs.length + " vật tư" : "";
}
function filterInventoryRows(q) { inventoryQuery = q || ""; applyInventoryFilters(); }
let inventorySort = { key: "", dir: 1 };
// Chu kỳ 3 nấc khi bấm 1 cột: tăng dần -> giảm dần -> tắt sắp xếp (về mặc định)
function setInventorySort(key) {
  if (inventorySort.key !== key) inventorySort = { key, dir: 1 };
  else if (inventorySort.dir === 1) inventorySort.dir = -1;
  else inventorySort = { key: "", dir: 1 };
  render();
}
function sortInd(key) {
  const st = inventorySort.key === key ? (inventorySort.dir === 1 ? "asc" : "desc") : "";
  return `<span class="sort-ind ${st}"><span class="u">▲</span><span class="d">▼</span></span>`;
}
// Tổng trọng lượng/dung tích tồn kho của 1 vật tư (từ trọng lượng mỗi gói/chai/bao)
function packTotal(r) {
  const pq = Number(r.pack_qty || 0), q = Number(r.quantity || 0);
  if (!(pq > 0)) return null;
  const u = r.pack_unit || "kg";
  const total = pq * q;
  if (u === "g") return { kg: total / 1000, text: total >= 1000 ? fmtNumInput(Math.round(total / 10) / 100) + " kg" : fmtNumInput(total) + " g" };
  if (u === "ml") return { lit: total / 1000, text: total >= 1000 ? fmtNumInput(Math.round(total / 10) / 100) + " lít" : fmtNumInput(total) + " ml" };
  if (u === "lít") return { lit: total, text: fmtNumInput(total) + " lít" };
  return { kg: total, text: fmtNumInput(total) + " kg" };
}
// Ảnh đại diện của vật tư trong bảng kho: ảnh đầu tiên đã chụp cho vật tư đó.
// Bấm vào ảnh (hoặc ô 📷 khi chưa có ảnh) là mở mục ảnh của vật tư để xem/chụp thêm.
function invThumb(r) {

// Nội dung file CSV lịch sử nhập kho (để xuất ra xem/lưu ngoài app)
function stockInsCSV() {
  const escCSV = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const hist = [...cache.stock_ins].sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.created_at || "").localeCompare(b.created_at || ""));
  const lines = [["Ngày", "Vật tư", "Số lượng", "Đơn vị", "Đơn giá (đ)", "Thành tiền (đ)", "Ghi chú"].map(escCSV).join(",")];
  hist.forEach(h => {
    const it = cache.inventory.find(i => i.id === h.item_id);
    lines.push([fmtDate(h.date), h.item_name || (it ? it.name : ""), h.qty, it ? it.unit || "" : "", h.unit_price || 0, h.total || 0, h.note || ""].map(escCSV).join(","));

function exportStockInsCSV() {
  const blob = new Blob(["\ufeff" + stockInsCSV()], { type: "text/csv;charset=utf-8" });

  a.download = "lich-su-nhap-kho-" + todayStr() + ".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function saveStockIn() {
  const form = document.getElementById("modalForm");
  if (!form.reportValidity()) return;
  const fd = new FormData(form);
  const item = cache.inventory.find(i => i.id === editing.item_id);
  if (!item) { closeForm(); return; }
  const qty = parseVN(fd.get("qty")) || 0;
  const total = parseVN(fd.get("total")) || 0;
  if (!(qty > 0)) { alert("Hãy nhập số lượng mua về lớn hơn 0."); return; }
  const date = fd.get("date") || todayStr();
  const price = Math.round((total / qty) * 100) / 100;
  const oldQty = Number(item.quantity || 0);
  const oldPrice = Number(item.unit_price || 0);
  const newQty = oldQty + qty;
  item.quantity = newQty;
  item.unit_price = oldQty > 0 ? Math.round((oldQty * oldPrice + total) / newQty) : Math.round(total / qty);
  await FarmDB.put("inventory", { ...item });
  const si = await FarmDB.put("stock_ins", { item_id: item.id, item_name: item.name, date, qty, unit_price: price, total, note: fd.get("note") || "" });
  if (total > 0) {
    const catMap = { "Phân bón": "Phân bón", "Thuốc": "Thuốc", "Giống": "Mua giống" };
    await FarmDB.put("finances", { date, type: "Chi", category: catMap[item.category] || "Khác", amount: total, planting_id: "", note: "Nhập kho: " + item.name + " (" + qty + " " + (item.unit || "") + ")", is_stock_purchase: true, stock_in_id: si.id });
  }
  closeForm(); render();
}
// Khấu hao kết thúc 1 vật tư: mốc trừ chi phí là ngày DÙNG HẾT hoặc ngày HỎNG do Bao nhập,
// trừ theo số lượng kết thúc (được trừ 1 phần). Giá trị = số lượng x đơn giá bình quân,
// thành 1 khoản chi "Khấu hao" ở Thu chi đúng ngày đã nhập. Hết tồn thì đóng vật tư (retired).
function depreStartDate(it) {
  const ins = cache.stock_ins.filter(s => s.item_id === it.id && s.date).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  return ins.length ? ins[0].date : (it.created_at || "").slice(0, 10);
}
function depreMonths(startD, endD) {
  if (!startD || !endD) return 0;
  const ms = new Date(endD + "T00:00:00").getTime() - new Date(startD + "T00:00:00").getTime();
  return Math.max(0, Math.round((ms / (30.44 * 24 * 3600 * 1000)) * 10) / 10);
}
function openDepreForm(itemId) {
  const it = cache.inventory.find(i => i.id === itemId); if (!it || it.retired) return;
  editing = { store: "depre", id: null, item_id: itemId };
  const startD = depreStartDate(it);
  document.getElementById("modalTitle").textContent = "Khấu hao - " + it.name;
  document.getElementById("modalForm").innerHTML = `
    <p class="note" style="margin-bottom:10px">Đang tồn <b>${it.quantity} ${esc(it.unit || "")}</b>, đơn giá bình quân <b>${fmtNumInput(it.unit_price || 0)} đ</b>${startD ? `, bắt đầu dùng từ ${fmtDate(startD)}` : ""}. Khi vật tư dùng hết hoặc bị hỏng, ghi khấu hao tại đây: giá trị của số lượng kết thúc sẽ thành 1 khoản chi Khấu hao ở Thu chi đúng ngày bạn nhập.</p>
    <div class="field"><label>Kết thúc vì</label><select name="reason"><option value="Dùng hết">Dùng hết</option><option value="Bị hỏng">Bị hỏng</option></select></div>
    <div class="field"><label>Ngày dùng hết / hỏng (mặc định hôm nay, sửa được)</label><input name="date" type="date" value="${todayStr()}" required></div>
    <div class="field"><label>Số lượng kết thúc *</label><input name="qty" type="text" inputmode="decimal" value="${it.quantity}" required></div>
    <div class="field"><label>Giá trị khấu hao trừ chi phí</label><div id="deprePreview" style="padding:10px 12px;background:var(--green-light);border-radius:8px;font-weight:600"></div></div>
    <p class="note">Kết thúc hết số tồn thì vật tư đóng lại, không hiện trong form chăm sóc nữa. Kết thúc 1 phần thì phần còn lại vẫn dùng tiếp bình thường.</p>`;
  overlay.classList.add("open");
  const form = document.getElementById("modalForm");
  const upd = () => {
    const q = parseVN(form.querySelector("[name=qty]").value) || 0;
    const d = form.querySelector("[name=date]").value || todayStr();
    const val = Math.round(q * Number(it.unit_price || 0));
    const months = depreMonths(startD, d);
    const box = document.getElementById("deprePreview");
    if (box) box.textContent = fmtMoney(val) + (months ? " - đã dùng khoảng " + months + " tháng" + (val ? ", bình quân " + fmtMoney(Math.round(val / months)) + "/tháng" : "") : "");
  };
  form.querySelector("[name=qty]").addEventListener("input", upd);
  form.querySelector("[name=date]").addEventListener("input", upd);
  upd();
}

  if (!it) { closeForm(); return; }
  const qty = parseVN(fd.get("qty")) || 0;
  const stock = Number(it.quantity || 0);
  if (!(qty > 0)) { alert("Hãy nhập số lượng kết thúc lớn hơn 0."); return; }
  if (qty > stock) { alert("Số lượng kết thúc (" + qty + ") lớn hơn số đang tồn (" + stock + "). Hãy kiểm tra lại."); return; }
  const reason = fd.get("reason") || "Dùng hết";
  const date = fd.get("date") || todayStr();
  const value = Math.round(qty * Number(it.unit_price || 0));
  const months = depreMonths(depreStartDate(it), date);
  it.quantity = stock - qty;
  if (it.quantity <= 0) { it.quantity = 0; it.retired = true; it.retire_reason = reason; it.retired_at = date; }
  await FarmDB.put("inventory", { ...it });
  if (value > 0) {
    await FarmDB.put("finances", { date, type: "Chi", category: "Khấu hao", amount: value, planting_id: "", zone_id: "", note: "Khấu hao " + (reason === "Bị hỏng" ? "hỏng" : "dùng hết") + ": " + it.name + " (" + qty + " " + (it.unit || "") + ")" + (months ? " - dùng khoảng " + months + " tháng" : ""), is_depre_writeoff: true, item_id: it.id });
  }
  closeForm(); render();
}
/* ===== Kiểm kho: đối chiếu số đếm thực tế với sổ sách =====
   Đếm theo đơn vị gói/chai/bao như số tồn hiện tại. Ô để trống = chưa đếm, giữ nguyên sổ.
   Phần HỤT được hiểu là vật tư đã dùng mà chưa kê khai ở nhật ký chăm sóc, nên giá trị hụt
   thành 1 khoản chi "Kiểm kho" ở Thu chi (tính vào chi phí mùa vụ). Phần THỪA chỉ sửa lại tồn. */
function stockCheckItems() {
  return [...cache.inventory].filter(i => !i.retired)
    .sort((a, b) => (invCatIdx(invBucket(a)) - invCatIdx(invBucket(b))) || searchKey(a.name).localeCompare(searchKey(b.name)));
}
function openStockCheck() {

  document.getElementById("modalForm").innerHTML = `

    <div class="field"><label>🔍 Tìm nhanh vật tư</label><input id="scSearch" type="text" placeholder="Gõ tên vật tư..." oninput="filterStockCheckRows(this.value)"></div>

function scRowCalc(row) {
  const inp = row.querySelector(".sc-count");
  const raw = (inp.value || "").trim();
  if (!raw) return null;
  const v = parseVN(raw);
  if (v === "" || v == null || isNaN(v) || v < 0) return { invalid: true };
  const book = Number(inp.dataset.book || 0), price = Number(inp.dataset.price || 0);
  return { counted: v, book, diff: v - book, value: Math.round((v - book) * price), unit: inp.dataset.unit || "" };
}
function updStockCheckRow(input) {
  const row = input.closest(".sc-row"); if (!row) return;
  const box = row.querySelector(".sc-diff");
  const c = scRowCalc(row);
  if (!c) box.textContent = "";
  else if (c.invalid) { box.textContent = "Số không hợp lệ"; box.style.color = "var(--danger)"; }
  else if (c.diff === 0) { box.textContent = "✓ Khớp sổ sách"; box.style.color = "var(--muted)"; }
  else if (c.diff < 0) { box.textContent = "Hụt " + fmtNumInput(-c.diff) + " " + c.unit + " ≈ " + fmtMoney(-c.value); box.style.color = "var(--danger)"; }
  else { box.textContent = "Thừa " + fmtNumInput(c.diff) + " " + c.unit + " ≈ +" + fmtMoney(c.value); box.style.color = "var(--green-dark)"; }
  updStockCheckSummary();
}
function updStockCheckSummary() {
  const rows = [...document.querySelectorAll(".sc-row")];
  let counted = 0, loss = 0, surplus = 0, invalid = 0;
  rows.forEach(r => { const c = scRowCalc(r); if (!c) return; if (c.invalid) { invalid++; return; } counted++; if (c.value < 0) loss += -c.value; else surplus += c.value; });
  const box = document.getElementById("scSummary");
  if (!box) return;
  box.textContent = (counted || invalid)
    ? "Đã đếm " + counted + " / " + rows.length + " món" + (loss ? " - Tổng hụt: " + fmtMoney(loss) + " (sẽ ghi chi Kiểm kho)" : "") + (surplus ? " - Tổng thừa: +" + fmtMoney(surplus) : "") + (invalid ? " - Có " + invalid + " ô nhập sai" : "")
    : "Chưa đếm món nào.";
}
function filterStockCheckRows(q) {
  const key = searchKey((q || "").trim());
  document.querySelectorAll(".sc-row").forEach(r => { r.style.display = !key || r.dataset.search.includes(key) ? "" : "none"; });
}
async function saveStockCheck() {
  const form = document.getElementById("modalForm");
  if (!form.reportValidity()) return;
  const fd = new FormData(form);
  const date = fd.get("date") || todayStr();
  const items = [], bad = [];
  document.querySelectorAll(".sc-row").forEach(row => {
    const it = cache.inventory.find(i => i.id === row.dataset.id); if (!it) return;
    const c = scRowCalc(row);
    if (!c) return;
    if (c.invalid) { bad.push(it.name); return; }
    items.push({ item_id: it.id, name: it.name, unit: it.unit || "", book_qty: Number(it.quantity || 0), counted_qty: c.counted, unit_price: Number(it.unit_price || 0), diff: c.counted - Number(it.quantity || 0) });
  });
  if (bad.length) { alert("Có ô số đếm chưa hợp lệ:\n- " + bad.join("\n- ") + "\nHãy nhập số đếm đúng (VD: 3, 2,5, 1/2) hoặc để trống nếu chưa đếm."); return; }
  if (!items.length) { alert("Bạn chưa nhập số đếm cho vật tư nào. Hãy đếm và nhập ít nhất 1 món, hoặc bấm Hủy để thoát."); return; }
  const lossItems = items.filter(x => x.diff < 0), surplusItems = items.filter(x => x.diff > 0);
  const lossValue = Math.round(lossItems.reduce((a, x) => a + (-x.diff) * x.unit_price, 0));
  const surplusValue = Math.round(surplusItems.reduce((a, x) => a + x.diff * x.unit_price, 0));
  const changed = items.filter(x => x.diff !== 0);
  if (changed.length) {
    const msg = "Cập nhật tồn kho theo số đếm cho " + changed.length + " món?\n" +
      (lossItems.length ? "\nHụt " + lossItems.length + " món, trị giá " + fmtMoney(lossValue) + " - sẽ ghi khoản chi Kiểm kho vào Thu chi ngày " + fmtDate(date) + "." : "") +
      (surplusItems.length ? "\nThừa " + surplusItems.length + " món, trị giá " + fmtMoney(surplusValue) + " - chỉ sửa lại tồn kho." : "");
    if (!confirm(msg)) return;
  }
  for (const x of items) {
    if (x.diff === 0) continue;
    const it = cache.inventory.find(i => i.id === x.item_id); if (!it) continue;
    it.quantity = x.counted_qty;
    await FarmDB.put("inventory", { ...it });
  }
  const chk = await FarmDB.put("stock_checks", { date, note: fd.get("note") || "", items, loss_value: lossValue, surplus_value: surplusValue });
  if (lossValue > 0) {
    const detail = lossItems.map(x => x.name + " hụt " + fmtNumInput(-x.diff) + " " + x.unit).join("; ");
    const fin = await FarmDB.put("finances", { date, type: "Chi", category: "Kiểm kho", amount: lossValue, planting_id: "", zone_id: "", note: "Hao hụt kiểm kho (đã dùng, chưa kê khai): " + detail, is_stock_check_loss: true, stock_check_id: chk.id });
    await FarmDB.put("stock_checks", { ...chk, finance_id: fin.id });
  }
  closeForm(); render();
}

/* ===== Cây trong vườn (hồ sơ trồng theo từng mảnh đất) ===== */
function plantingTextOf(p) {
  if (p.planting_text) return p.planting_text;
  if (p.planting_date) return p.planting_date.split("-").reverse().join("/");
  return "";
}
function parsePlantingText(raw) {
  const t = String(raw || "").trim().replace(/[-.]/g, "/");
  if (!t) return { text: "", sort: "", precision: "" };
  const parts = t.split("/").filter(x => x !== "");
  const nowY = new Date().getFullYear();
  const okY = y => y >= 1950 && y <= nowY + 1;
  const pad = n => String(n).padStart(2, "0");
  if (parts.length === 3) {
    const d = Number(parts[0]), m = Number(parts[1]), y = Number(parts[2]);
    if (!(d >= 1 && d <= 31 && m >= 1 && m <= 12 && okY(y))) return null;
    return { text: pad(d) + "/" + pad(m) + "/" + y, sort: y + "-" + pad(m) + "-" + pad(d), precision: "day" };
  }
  if (parts.length === 2) {
    const m = Number(parts[0]), y = Number(parts[1]);
    if (!(m >= 1 && m <= 12 && okY(y))) return null;
    return { text: pad(m) + "/" + y, sort: y + "-" + pad(m) + "-01", precision: "month" };
  }
  if (parts.length === 1) {
    const y = Number(parts[0]);
    if (!okY(y)) return null;
    return { text: String(y), sort: y + "-01-01", precision: "year" };
  }
  return null;
}
function ageText(p) {
  const txt = plantingTextOf(p);
  if (txt) {
    const sort = p.planting_sort || p.planting_date || "";

function fieldInput(f, value) {
  const v = value ?? "";
  if (f.type === "number") return `<input name="${f.key}" type="text" inputmode="decimal" ${f.money ? 'data-money="1"' : ""} value="${esc(fmtNumInput(v))}" placeholder="${esc(f.placeholder || "")}" ${f.required ? "required" : ""}>`;
  if (f.type === "combo") {
    const extra = f.comboStore ? [...new Set(cache[f.comboStore].map(x => x[f.comboKey || f.key]).filter(Boolean))] : [];
    const opts = [...new Set([...(f.options || []), ...extra])];
    const lid = "dl_" + f.key;
    return `<input name="${f.key}" list="${lid}" value="${esc(v)}" placeholder="${esc(f.placeholder || "Gõ tự do hoặc chọn gợi ý")}"><datalist id="${lid}">${opts.map(o => `<option value="${esc(o)}">`).join("")}</datalist>`;
  }
  if (f.type === "select") return `<select name="${f.key}">${f.options.map(o => `<option ${o === v ? "selected" : ""}>${o}</option>`).join("")}</select>`;
  if (f.type === "ref") {
    const opts = cache[f.ref];
    return `<select name="${f.key}"><option value="">- Không chọn -</option>${opts.map(o => `<option value="${o.id}" ${o.id === v ? "selected" : ""}>${esc(o.name || o.title || o.crop_name || "")}</option>`).join("")}</select>`;
  }
  if (f.type === "textarea") return `<textarea name="${f.key}" rows="2" placeholder="${esc(f.placeholder || "")}">${esc(v)}</textarea>`;
  return `<input name="${f.key}" type="${f.type}" value="${esc(v)}" placeholder="${esc(f.placeholder || "")}" ${f.required ? "required" : ""}>`;
}

async function removeItem(store, id) {
  if (!confirm("Xóa mục này? Thao tác không hoàn tác được, hãy chắc chắn đã có backup.")) return;
  if (store === "care_logs") {
    const rec = cache.care_logs.find(x => x.id === id);
    if (rec && rec.status !== "Cần làm") for (const m of (rec.materials || [])) await adjustStock(m.item_id, Number(m.qty || 0));
  }
  if (store === "finances") {
    const rec = cache.finances.find(x => x.id === id);
    if (rec && rec.harvest_id) await FarmDB.remove("harvests", rec.harvest_id);
  }
  if (store === "harvests") {
    const rec = cache.harvests.find(x => x.id === id);
    if (rec && rec.finance_id) await FarmDB.remove("finances", rec.finance_id);
  }
  if (store === "special_trees") {
    for (const ph of cache.photos.filter(p => p.link_type === "special_tree" && p.link_id === id)) await FarmDB.remove("photos", ph.id);
  }
  await FarmDB.remove(store, id); render();
}

async function exportData() {

  const payload = { app: "farm-management", version: 1, exported_at: new Date().toISOString(), data: cache };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");

  a.click(); URL.revokeObjectURL(a.href);
}
document.getElementById("fileImport").addEventListener("change", async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const payload = JSON.parse(await file.text());
    if (!payload.data) throw new Error("bad file");
    if (!confirm("Nhập backup sẽ THAY THẾ toàn bộ dữ liệu hiện tại. Tiếp tục?")) return;
    await FarmDB.clearAll();
    for (const s of STORES) for (const rec of (payload.data[s] || [])) await FarmDB.put(s, rec);
    if (Cloud.ready()) { for (const s of STORES) for (const rec of (payload.data[s] || [])) enqueue("put", s, rec.id); syncNow(false); alert("Đã nhập backup. Dữ liệu đang được đẩy lên online, theo dõi trạng thái đồng bộ ở góc trên."); } else alert("Đã nhập backup xong.");
    go("dashboard");
  } catch { alert("File không đúng định dạng backup của app."); }
  e.target.value = "";
});

let careFilter = { zone_id: "", planting_id: "", activity: "" };
const CARE_ACTIVITIES = ["Phun thuốc trừ sâu", "Phun thuốc bệnh", "Bón phân", "Tưới nước", "Làm cỏ", "Cắt tỉa", "Bón vôi", "Tủ gốc / che phủ", "Kiểm tra vườn", "Khác"];
const fmtDate = iso => iso ? iso.split("-").reverse().join("/") : "";
function matPrice(m) {
  if (m.depre) return 0;
  if (m.unit_price) return Number(m.unit_price);
  const it = cache.inventory.find(i => i.id === m.item_id);
  return it ? Number(it.unit_price || 0) : 0;
}
// Danh sách mảnh của 1 bản ghi chăm sóc: bản ghi mới có zone_ids (nhiều mảnh),
// bản ghi cũ chỉ có zone_id (1 mảnh) vẫn đọc được.
function careZoneIds(l) {
  if (Array.isArray(l.zone_ids) && l.zone_ids.length) return l.zone_ids;
  return l.zone_id ? [l.zone_id] : [];
}
function scopeText(l) {
  if (l.planting_id) {
    const p = cache.plantings.find(x => x.id === l.planting_id);
    if (p) return esc(p.crop_name) + (p.variety ? " (" + esc(p.variety) + ")" : "") + " - " + refName("zones", p.zone_id);
  }
  const zs = careZoneIds(l);
  const names = zs.map(z => refName("zones", z)).join(", ");
  if (l.crop_scope) return esc(l.crop_scope) + (zs.length > 1 ? " - Cả " + zs.length + " mảnh: " + names : " - " + names);
  if (zs.length > 1) return "Cả " + zs.length + " mảnh: " + names;
  return "Cả mảnh - " + (zs[0] ? refName("zones", zs[0]) : "");
}
// Bản ghi chăm sóc có thuộc về 1 hồ sơ trồng cụ thể không: trực tiếp qua planting_id,
// hoặc gián tiếp qua loại cây áp dụng chung (crop_scope) ở nhiều mảnh có chứa mảnh của hồ sơ đó.
function careMatchesPlanting(l, plantingId) {
  if (l.planting_id) return l.planting_id === plantingId;
  if (!l.crop_scope) return false;
  const p = cache.plantings.find(x => x.id === plantingId);
  return !!p && l.crop_scope === p.crop_name && careZoneIds(l).includes(p.zone_id);
}
function recentCareList() {
  const list = [...cache.care_logs].filter(l => l.status !== "Cần làm").sort((a, b) => (b.date || "").localeCompare(a.date || "")).slice(0, 5);
  return list.length ? list.map(l => `<tr><td>${fmtDate(l.date)}</td><td>${esc(l.activity)}</td><td>${scopeText(l)}</td></tr>`).join("")
    : `<tr><td style="color:var(--muted)">Chưa có ghi chép chăm sóc nào.</td></tr>`;
}

    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">

      <button class="btn secondary small" onclick="openCareForm('Bón phân')">+ Bón phân</button>
      <button class="btn secondary small" onclick="openCareForm('Tưới nước')">+ Tưới nước</button>

    <div class="card" style="display:flex;gap:8px;flex-wrap:wrap">

function inPeriod(date, from, to) { return date && date >= from && date <= to; }
function finInScope(f, plantingId) {
  if (!plantingId) return true;
  return f.planting_id === plantingId;
}
function calcPeriod(save) {
  const label = document.getElementById("perLabel").value.trim();
  const from = document.getElementById("perFrom").value;
  const to = document.getElementById("perTo").value;
  const plantingId = document.getElementById("perPlanting").value;
  if (!from || !to || from > to) { alert("Hãy chọn khoảng ngày hợp lệ (từ ngày nhỏ hơn đến ngày)."); return; }
  if (save && !label) { alert("Hãy nhập nhãn mùa vụ để lưu lại."); return; }
  const logs = cache.care_logs.filter(l => l.status !== "Cần làm" && inPeriod(l.date, from, to) && (!plantingId || careMatchesPlanting(l, plantingId)));
  const careCash = logs.reduce((a, l) => a + Number(l.cost_amount || 0), 0);
  const fins = cache.finances.filter(f => inPeriod(f.date, from, to) && finInScope(f, plantingId));
  const finChi = fins.filter(f => f.type === "Chi" && !f.is_stock_purchase).reduce((a, f) => a + Number(f.amount || 0), 0);
  const purchaseTotal = cache.finances.filter(f => f.type === "Chi" && f.is_stock_purchase && inPeriod(f.date, from, to)).reduce((a, f) => a + Number(f.amount || 0), 0);
  const finThu = fins.filter(f => f.type === "Thu").reduce((a, f) => a + Number(f.amount || 0), 0);
  const salesThu = fins.filter(f => f.type === "Thu" && f.is_harvest_sale).reduce((a, f) => a + Number(f.amount || 0), 0);
  const harvAgg = {};
  cache.harvests.filter(h => inPeriod(h.date, from, to) && (!plantingId || h.planting_id === plantingId)).forEach(h => { const k = h.crop_name + "|" + (h.unit || ""); if (!harvAgg[k]) harvAgg[k] = { crop: h.crop_name, unit: h.unit || "", qty: 0, money: 0 }; harvAgg[k].qty += Number(h.qty || 0); harvAgg[k].money += Number(h.total || 0); });
  const harvList = Object.values(harvAgg);
  const totalChiAll = matValue + careCash + finChi;
  const laiLo = finThu - totalChiAll;
  const matAgg = {};
  logs.forEach(l => (l.materials || []).forEach(m => { const k = m.name + "|" + (m.unit || ""); if (!matAgg[k]) matAgg[k] = { name: m.name, unit: m.unit || "", qty: 0, value: 0, depre: 0 }; if (m.depre) { matAgg[k].depre++; return; } matAgg[k].qty += Number(m.qty || 0); matAgg[k].value += Number(m.qty || 0) * matPrice(m); }));
  const matList = Object.values(matAgg);
  const matValue = matList.reduce((a, m) => a + m.value, 0);
  document.getElementById("periodResult").innerHTML = `
    <div class="card" style="background:var(--green-light);border:none">
      <b>${esc(label || "Tổng kết")}:</b> ${fmtDate(from)} - ${fmtDate(to)}<br><br>
      - Số lần chăm sóc: <b>${logs.length}</b><br>
      - Tiền vật tư đã dùng: <b>${fmtMoney(matValue)}</b><br>
      - Chi phí tiền mặt khi chăm sóc (công, xăng dầu...): <b>${fmtMoney(careCash)}</b><br>
      - Chi khác ghi ở mục Thu chi: <b>${fmtMoney(finChi)}</b><br>
      - Thu trong khoảng (mục Thu chi): <b>${fmtMoney(finThu)}</b>, trong đó bán nông sản: <b>${fmtMoney(salesThu)}</b><br>
      - Sản lượng đã thu: ${harvList.length ? harvList.map(h => esc(h.crop) + ": " + (Math.round(h.qty * 100) / 100).toLocaleString("vi-VN") + " " + esc(h.unit) + " (" + fmtMoney(h.money) + ")").join(" · ") : "chưa ghi thu hoạch nào"}<br>
      - <b>Tổng chi mùa vụ: ${fmtMoney(totalChiAll)}</b><br>
      - <b style="font-size:17px">${laiLo >= 0 ? "✅ LÃI" : "🔻 LỖ"}: ${fmtMoney(Math.abs(laiLo))}</b> (Tổng thu trừ Tổng chi)<br><br>
      <b>Vật tư đã dùng:</b> ${matList.length ? matList.map(m => esc(m.name) + ": " + (m.qty ? m.qty + " " + esc(m.unit) + (m.value ? " (" + fmtMoney(m.value) + ")" : "") : "") + (m.depre ? (m.qty ? " · " : "") + "khấu hao " + m.depre + " lần" : "")).join(" · ") : "không có"}<br>
      <span class="note">Trong khoảng này bạn đã mua vật tư nhập kho hết ${fmtMoney(purchaseTotal)}. Khoản mua đó là tiền ra ở Thu chi, nhưng không cộng vào tổng chi mùa vụ để tránh tính 2 lần: chi phí vật tư được tính vào mùa vụ tại thời điểm dùng, theo đơn giá bình quân. Vật tư nào chưa có đơn giá thì tiền được tính bằng 0, hãy bổ sung đơn giá ở mục Kho. Riêng vật tư khấu hao (dụng cụ, thùng dùng dần): không tính tiền lúc dùng, giá trị của chúng được trừ thành 1 khoản chi Khấu hao ở Thu chi vào ngày dùng hết hoặc ngày hỏng mà bạn ghi ở mục Kho, nên mùa vụ chứa ngày đó sẽ gánh chi phí này.</span>
    </div>`;
  if (save) {
    FarmDB.put("periods", { label, from_date: from, to_date: to, planting_id: plantingId }).then(() => { alert("Đã lưu nhãn mùa vụ."); render(); });
  }
}
function viewPeriod(id) {
  const pr = cache.periods.find(x => x.id === id); if (!pr) return;
  currentView = "finances"; renderNav();
  render().then(() => {
    document.getElementById("perLabel").value = pr.label || "";
    document.getElementById("perFrom").value = pr.from_date || "";
    document.getElementById("perTo").value = pr.to_date || "";
    document.getElementById("perPlanting").value = pr.planting_id || "";
    calcPeriod(false);
  });
}

// Thống kê vật tư đã từng ghi ở các lần chăm sóc trước (để ưu tiên gợi ý)
function matUsageStats() {
  const st = {};
  cache.care_logs.forEach(l => (l.materials || []).forEach(m => {
    if (!m.item_id) return;
    if (!st[m.item_id]) st[m.item_id] = { count: 0, last: "" };
    st[m.item_id].count++;
    if ((l.date || "") > st[m.item_id].last) st[m.item_id].last = l.date || "";
  }));
  return st;
}
// Gợi ý vật tư khi gõ ở form chăm sóc: lọc theo tên + nhóm, gõ không dấu cũng khớp.
// Vật tư ĐÃ DÙNG TRƯỚC ĐÂY luôn xếp trước (mục riêng khi chưa gõ gì), kèm số lần đã dùng.
function fillMatSuggestions(input) {
  const wrap = input.closest(".mat-pick"); if (!wrap) return;
  const box = wrap.querySelector(".mat-sug"); if (!box) return;
  const key = searchKey((input.value || "").trim());
  const stats = matUsageStats();
  // Vật tư đã chọn ở dòng khác trong cùng form thì ẩn khỏi danh sách gợi ý MẶC ĐỊNH (chưa gõ gì)
  // cho đỡ rườm rà. Nhưng hễ gõ tìm kiếm (vài chữ như "phân xô", "amino") là hiện lại như tìm kiếm thường.
  const otherIds = new Set();
  if (!key) document.querySelectorAll(".mat-row").forEach(r => {
    const inp = r.querySelector(".mat-item");
    if (!inp || inp === input) return;
    if (inp.dataset.id) { otherIds.add(inp.dataset.id); return; }
    const v = (inp.value || "").trim(); if (!v) return;
    const found = cache.inventory.find(i => searchKey(i.name) === searchKey(v));
    if (found) otherIds.add(found.id);
  });
  const match = cache.inventory.filter(i => !i.retired && (!key || searchKey(i.name + " " + (i.category || "")).includes(key)))
    .filter(i => !otherIds.has(i.id));
  const used = match.filter(i => stats[i.id]).sort((a, b) => (stats[b.id].count - stats[a.id].count) || (stats[b.id].last || "").localeCompare(stats[a.id].last || ""));
  const rest = match.filter(i => !stats[i.id]).sort((a, b) => searchKey(a.name).localeCompare(searchKey(b.name)));
  const rowHTML = i => `<div class="mat-sug-item" data-id="${i.id}" style="padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--green-light)"><b>${esc(i.name)}</b> <span class="note">(còn ${i.quantity} ${esc(i.unit || "")}) - ${esc(i.category || "")}${stats[i.id] ? " - đã dùng " + stats[i.id].count + " lần" : ""}</span></div>`;
  const headHTML = t => `<div style="padding:6px 12px;font-size:12px;font-weight:700;color:var(--green-dark);background:var(--green-light)">${t}</div>`;
  let html = "";
  if (!key && used.length) {
    html += headHTML("Đã dùng trước đây") + used.slice(0, 8).map(rowHTML).join("");
    if (rest.length) html += headHTML("Vật tư khác trong kho") + rest.slice(0, Math.max(0, 12 - used.length)).map(rowHTML).join("");
  } else {
    html = [...used, ...rest].slice(0, 12).map(rowHTML).join("");
  }
  if (!html) { box.innerHTML = `<div style="padding:9px 12px;color:var(--muted)">Không thấy vật tư nào khớp trong kho</div>`; box.style.display = "block"; return; }
  box.innerHTML = html;
  box.style.display = "block";
}
document.addEventListener("focusin", e => { if (e.target.classList && e.target.classList.contains("mat-item")) fillMatSuggestions(e.target); });
document.addEventListener("input", e => {
  if (!e.target.classList || !e.target.classList.contains("mat-item")) return;
  const input = e.target;
  if (input.dataset.id && input.dataset.name !== input.value) { input.dataset.id = ""; }
  fillMatSuggestions(input);
});
document.addEventListener("mousedown", e => {
  const sugItem = e.target.closest ? e.target.closest(".mat-sug-item") : null;
  if (sugItem) {
    const wrap = sugItem.closest(".mat-pick");
    const input = wrap ? wrap.querySelector(".mat-item") : null;
    const it = cache.inventory.find(i => i.id === sugItem.dataset.id);
    if (input && it) { input.value = it.name; input.dataset.id = it.id; input.dataset.name = it.name; }
    const box = wrap ? wrap.querySelector(".mat-sug") : null;
    if (box) box.style.display = "none";
    return;
  }
  if (!(e.target.closest && e.target.closest(".mat-pick"))) document.querySelectorAll(".mat-sug").forEach(b => { b.style.display = "none"; });
});
// Khớp ô gõ vật tư với 1 món trong kho: theo id đã chọn, theo tên chính xác, hoặc khớp duy nhất
function resolveMatItem(input) {
  const raw = (input.value || "").trim();
  if (!raw) return null;
  if (input.dataset.id && input.dataset.name === raw) { const it = cache.inventory.find(i => i.id === input.dataset.id); if (it) return it; }
  const key = searchKey(raw);
  const exact = cache.inventory.find(i => searchKey(i.name) === key);
  if (exact) return exact;
  const cands = cache.inventory.filter(i => !i.retired && searchKey(i.name + " " + (i.category || "")).includes(key));
  return cands.length === 1 ? cands[0] : null;
}
// Đọc ô số lượng vật tư: số thường, phân số 1/2, hoặc theo trọng lượng "50ml" / "200g" cho vật tư có pack_qty
function parseMatQty(raw, item) {
  const t = String(raw || "").trim().toLowerCase();
  if (!t) return null;
  const wm = t.match(/^([\d.,\/]+)\s*(g|kg|ml|lít|lit|l)$/);
  if (wm && item && Number(item.pack_qty || 0) > 0) {
    const base = parseVN(wm[1]);
    if (base === "") return null;
    const FAM = { g: ["mass", 1], kg: ["mass", 1000], ml: ["vol", 1], "lít": ["vol", 1000], lit: ["vol", 1000], l: ["vol", 1000] };
    const pu = FAM[(item.pack_unit || "kg").toLowerCase()];
    const en = FAM[wm[2]];
    if (pu && en && pu[0] === en[0]) {
      const qty = Math.round(((base * en[1]) / (Number(item.pack_qty) * pu[1])) * 10000) / 10000;
      return { qty, text: t.replace(/\s+/g, "") };
    }
  }
  const n = parseVN(t);
  if (n === "") return null;
  return { qty: n, text: t.includes("/") ? t : "" };
}

async function markCareDone(id) {
  const rec = cache.care_logs.find(x => x.id === id); if (!rec) return;
  const mats = rec.materials || [];
  const warns = [];
  mats.forEach(m => { const it = cache.inventory.find(i => i.id === m.item_id); if (it && m.qty > Number(it.quantity || 0)) warns.push(m.name + ": kho còn " + it.quantity + " " + m.unit + ", cần dùng " + m.qty); });
  if (warns.length && !confirm("Cảnh báo tồn kho:\n" + warns.join("\n") + "\n\nVẫn đánh dấu đã làm? Tồn kho sẽ bị âm.")) return;
  for (const m of mats) await adjustStock(m.item_id, -Number(m.qty || 0));
  rec.status = "Đã làm";
  await FarmDB.put("care_logs", { ...rec });
  render();
}
async function adjustStock(itemId, delta) {
  if (!itemId || !delta) return;
  const it = cache.inventory.find(i => i.id === itemId);
  if (!it) return;
  it.quantity = Number(it.quantity || 0) + delta;
  await FarmDB.put("inventory", { ...it });
}
async function saveCare() {
  const form = document.getElementById("modalForm");
  if (!form.reportValidity()) return;
  const fd = new FormData(form);
  const data = editing.id ? { ...cache.care_logs.find(x => x.id === editing.id) } : {};
  data.date = fd.get("date") || todayStr();
  const scopeVal = fd.get("planting_id") || "";
  data.activity = String(fd.get("activity") || "").trim();
  const caParsed = parseVN(fd.get("cost_amount")); data.cost_amount = caParsed === "" ? 0 : caParsed;
  data.notes = fd.get("notes") || "";
  data.status = fd.get("status") || "Đã làm";
  if (!data.activity) { alert("Hãy nhập loại việc chăm sóc."); return; }
  // Mảnh đất: tick chọn được nhiều mảnh. zone_id giữ mảnh đầu tiên (tương thích bản ghi cũ),
  // zone_ids giữ toàn bộ các mảnh đã chọn.
  // Ô Áp dụng cho có 3 dạng: "" = chăm sóc chung các mảnh đã chọn;
  // "crop:Tên cây" = áp dụng cho 1 loại cây ở các mảnh đã chọn (lưu crop_scope);
  // id hồ sơ trồng = áp dụng cho đúng hồ sơ đó (chỉ khi chọn 1 mảnh), mảnh = mảnh của hồ sơ.
  data.crop_scope = "";
  data.planting_id = "";
  if (scopeVal.startsWith("crop:")) {
    data.crop_scope = scopeVal.slice(5);
    data.zone_ids = checkedCareZones();
    data.zone_id = data.zone_ids[0] || "";
  } else if (scopeVal) {
    data.planting_id = scopeVal;
    const p = cache.plantings.find(x => x.id === scopeVal);
    if (p) { data.zone_id = p.zone_id; data.zone_ids = [p.zone_id]; }
  } else {
    data.zone_ids = checkedCareZones();
    data.zone_id = data.zone_ids[0] || "";
  }
  if (!data.zone_ids || !data.zone_ids.length) { alert("Hãy tạo mảnh đất và tick chọn ít nhất 1 mảnh."); return; }
  const mats = [];
  const badRows = [];
  document.querySelectorAll(".mat-row").forEach(r => {
    const itemInput = r.querySelector(".mat-item");
    if (!itemInput || !(itemInput.value || "").trim()) return;
    const it = resolveMatItem(itemInput);
    if (!it) { badRows.push(itemInput.value.trim()); return; }
    const modeEl = r.querySelector(".mat-mode");
    if (modeEl && modeEl.value === "depre") { mats.push({ item_id: it.id, name: it.name, qty: 0, unit: it.unit || "", unit_price: 0, depre: true }); return; }
    const rawQty = r.querySelector(".mat-qty").value;
    if (!(rawQty || "").trim()) return;
    const pq = parseMatQty(rawQty, it);
    if (!pq) { badRows.push(it.name + " (số lượng: " + rawQty + ")"); return; }
    if (pq.qty > 0) mats.push({ item_id: it.id, name: it.name, qty: pq.qty, unit: it.unit || "", unit_price: Number(it.unit_price || 0), qty_text: pq.text || "" });
  });
  if (badRows.length) { alert("Chưa lưu được vì có dòng vật tư chưa khớp:\n- " + badRows.join("\n- ") + "\n\nHãy bấm vào ô vật tư và chọn đúng món trong gợi ý, hoặc kiểm tra lại số lượng (VD: 2, 1/2, 50ml, 200g)."); return; }
  const old = editing.id ? cache.care_logs.find(x => x.id === editing.id) : null;
  const oldWasDone = old && old.status !== "Cần làm";
  const newIsDone = data.status !== "Cần làm";
  if (newIsDone) {
    const warns = [];
    mats.forEach(m => {
      const it = cache.inventory.find(i => i.id === m.item_id); if (!it) return;
      let avail = Number(it.quantity || 0);
      if (oldWasDone) { const om = (old.materials || []).find(x => x.item_id === m.item_id); if (om) avail += Number(om.qty || 0); }
      if (m.qty > avail) warns.push(m.name + ": kho còn " + avail + " " + m.unit + ", bạn dùng " + m.qty);
    });
    if (warns.length && !confirm("Cảnh báo tồn kho:\n" + warns.join("\n") + "\n\nVẫn lưu? Tồn kho sẽ bị âm, bạn nên kiểm tra lại kho sau.")) return;
  }
  if (oldWasDone) for (const om of (old.materials || [])) await adjustStock(om.item_id, Number(om.qty || 0));
  if (newIsDone) for (const m of mats) await adjustStock(m.item_id, -Number(m.qty || 0));
  data.materials = mats;
  await FarmDB.put("care_logs", data);
  closeForm(); render();
}

/* ===== Nhập tiền kiểu app ngân hàng: tự chèn dấu nghìn + chip gợi ý ===== */
function moneySuggestions(input) {
  const digits = input.value.replace(/\D/g, "");
  const field = input.closest(".field") || input.parentElement;
  let box = field.querySelector(".money-suggest");
  if (!digits || digits.length > 9) { if (box) box.remove(); return; }
  const n = parseInt(digits, 10);
  if (!n) { if (box) box.remove(); return; }
  if (!box) { box = document.createElement("div"); box.className = "money-suggest"; field.appendChild(box); }
  const vals = [n * 1000, n * 10000, n * 100000, n * 1000000];
  box.innerHTML = vals.map(v => `<button type="button" class="money-chip" data-val="${v}">${v.toLocaleString("vi-VN")}</button>`).join("");
}
document.addEventListener("input", e => {
  const el = e.target;
  if (el.matches && el.matches("[data-money]")) {
    const digits = el.value.replace(/\D/g, "");
    el.value = digits ? parseInt(digits, 10).toLocaleString("vi-VN") : "";
    moneySuggestions(el);
  }
});
document.addEventListener("click", e => {
  const chip = e.target.closest ? e.target.closest(".money-chip") : null;
  if (!chip) return;
  const field = chip.closest(".field");
  const input = field ? field.querySelector("[data-money]") : null;
  if (input) { input.value = Number(chip.dataset.val).toLocaleString("vi-VN"); moneySuggestions(input); input.focus(); }
});

const WEIGHT_TO_KG = { "tấn": 1000, "tan": 1000, "tạ": 100, "ta": 100, "yến": 10, "yen": 10 };
function weightFactor(unit) { return WEIGHT_TO_KG[(unit || "").trim().toLowerCase()] || 0; }
function updateHarvestPreview() {
  const form = document.getElementById("modalForm"); if (!form) return;
  const pv = document.getElementById("hvPreview"); if (!pv) return;
  const hint = document.getElementById("hvKgHint");
  const q = parseVN(form.querySelector("[name=qty]").value);
  const pr = moneyVal(form.querySelector("[name=price]"));
  const unit = (form.querySelector("[name=unit]").value || "").trim();
  const factor = weightFactor(unit);
  const effQty = factor ? q * factor : q;
  pv.textContent = (q !== "" && pr !== "") ? fmtMoney(Math.round(effQty * pr)) : "-";
  let msg = "";
  if (q !== "" && factor) msg = "Đơn vị cân nặng tự quy về kg: " + fmtNumInput(q) + " " + unit + " = " + fmtNumInput(effQty) + " kg, đơn giá hiểu là giá 1 kg. Khi lưu, sản lượng sẽ thành " + fmtNumInput(effQty) + " kg.";
  if (hint) hint.textContent = msg;
}
async function saveHarvest() {
  const form = document.getElementById("modalForm");
  if (!form.reportValidity()) return;
  const q = n => form.querySelector(`[name=${n}]`);
  const plantingId = q("planting_id").value;
  let cropName = q("crop_name").value.trim();
  let zoneId = "";
  if (plantingId) { const p = cache.plantings.find(x => x.id === plantingId); if (p) { cropName = p.crop_name; zoneId = p.zone_id; } }
  if (!cropName) { alert("Hãy chọn cây trong vườn hoặc gõ tên cây."); return; }
  const qtyIn = parseVN(q("qty").value);
  if (qtyIn === "" || qtyIn <= 0) { alert("Hãy nhập sản lượng (lớn hơn 0)."); return; }
  const price = parseVN(q("price").value) || 0;
  const unitIn = q("unit").value.trim() || "kg";
  const factor = weightFactor(unitIn);
  const qty = factor ? qtyIn * factor : qtyIn;
  const unit = factor ? "kg" : unitIn;
  const total = Math.round(qty * price);
  const buyer = q("buyer").value.trim();
  const date = q("date").value || todayStr();
  const content = "Bán " + cropName + " (" + fmtNumInput(qty) + " " + unit + ")";
  if (editing.id) {
    const old = cache.harvests.find(x => x.id === editing.id);
    await FarmDB.put("harvests", { ...old, date, planting_id: plantingId, crop_name: cropName, zone_id: zoneId, qty, unit, price, total, buyer, notes: q("notes").value || "" });
    if (old.finance_id) {
      const fin = cache.finances.find(f => f.id === old.finance_id);
      if (fin) await FarmDB.put("finances", { ...fin, date, amount: total, content, zone_id: zoneId, planting_id: plantingId, notes: buyer ? "Người mua: " + buyer : "" });
    }
  } else {
    const saved = await FarmDB.put("harvests", { date, planting_id: plantingId, crop_name: cropName, zone_id: zoneId, qty, unit, price, total, buyer, notes: q("notes").value || "" });
    const fin = await FarmDB.put("finances", { date, type: "Thu", category: "Bán nông sản", content, amount: total, zone_id: zoneId, planting_id: plantingId, notes: buyer ? "Người mua: " + buyer : "", is_harvest_sale: true, harvest_id: saved.id });
    await FarmDB.put("harvests", { ...saved, finance_id: fin.id });
  }
  closeForm(); render();
}

function compressImageFile(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1280;
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, max / Math.max(w, h));
      w = Math.max(1, Math.round(w * scale)); h = Math.max(1, Math.round(h * scale));
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.75));
    };
    img.onerror = reject;
    img.src = url;
  });
}
async function handlePhotoFile(input, previewId) {
  const f = input.files && input.files[0]; if (!f) return;
  try { pendingPhotoData = await compressImageFile(f); } catch { alert("Không đọc được file ảnh này."); return; }
  const pv = document.getElementById(previewId);

}

function treeAgeAt(p, dateStr) {
  if (!p || !p.planting_sort || !dateStr) return "";

  if (days < 60) return "Cây được " + days + " ngày tuổi";

  return "Cây ở năm thứ " + (Math.floor(days / 365) + 1);
}

/* ===== Online: Supabase + đồng bộ (Giai đoạn 2) =====
   Thiết kế: dữ liệu luôn ghi vào IndexedDB trên máy trước (offline vẫn dùng được),
   rồi đẩy lên Supabase qua hàng đợi. Mở app thì kéo dữ liệu mới nhất từ cloud về.
   Xung đột giải quyết theo mốc updated_at mới nhất (last-write-wins). */
const Cloud = {
  cfg() { try { return JSON.parse(localStorage.getItem("tachi_cloud") || "null"); } catch { return null; } },
  session() { try { return JSON.parse(localStorage.getItem("tachi_session") || "null"); } catch { return null; } },
  saveSession(s) { if (s) localStorage.setItem("tachi_session", JSON.stringify(s)); else localStorage.removeItem("tachi_session"); },
  ready() { const c = Cloud.cfg(), s = Cloud.session(); return !!(c && s && s.access_token); },
  async req(path, opts = {}) {
    const c = Cloud.cfg(); if (!c) throw new Error("Chưa cấu hình Supabase");
    const s = Cloud.session();
    const headers = { apikey: c.anonKey, "Content-Type": "application/json", ...(opts.headers || {}) };
    if (s && s.access_token) headers.Authorization = "Bearer " + s.access_token;
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 25000);
    try { return await fetch(c.url.replace(/\/$/, "") + path, { ...opts, headers, signal: ctl.signal }); }

async function flushQueue() {

        catch (e) { lastSyncError = job.store + ": " + ((e && e.message) || String(e)); break; }

      if (doneKeys.size) setQueue(getQueue().filter(x => !doneKeys.has(x.store + "|" + x.id + "|" + x.ts)));

async function pullAll() {

const aiSleep = ms => new Promise(r => setTimeout(r, ms));
/* Gọi Gemini dùng chung cho mọi tính năng AI: thử lần lượt các model,
   gặp 429/503 thì chờ 4 giây thử lại đúng model đó 1 lần rồi mới qua
   model kế (Google hay quá tải chớp nhoáng kiểu 503 high demand). */
async function geminiCall(parts, temperature) {
  const key = geminiKey();
  if (!key) throw new Error("Chưa nhập khóa Gemini trên máy này. Hãy vào mục Dữ liệu, thẻ \"Đọc nhãn thuốc bằng AI\" để dán khóa trước.");
  let lastErr = "", sawBusy = false;
  for (const model of GEMINI_MODELS) {
    for (let attempt = 0; attempt < 2; attempt++) {
      let res;
      try {
        res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-goog-api-key": key },
          body: JSON.stringify({ contents: [{ parts }], generationConfig: { responseMimeType: "application/json", temperature: temperature } })
        });
      } catch (e) { lastErr = "Không gọi được Gemini, hãy kiểm tra mạng."; break; }
      if (!res.ok) {
        const t = res.text ? await res.text().catch(() => "") : "";
        if (t.includes("API_KEY_INVALID")) throw new Error("Khóa Gemini không đúng. Hãy kiểm tra lại khóa ở mục Dữ liệu.");
        if (res.status === 403) throw new Error("Khóa Gemini bị từ chối quyền (403). Hãy kiểm tra lại khóa ở mục Dữ liệu.");
        if (res.status === 429 || res.status === 503) {
          sawBusy = true;
          lastErr = "Model " + model + " đang bận hoặc đã hết lượt miễn phí hôm nay (" + res.status + ").";
          if (attempt === 0) { await aiSleep(4000); continue; }
          break;
        }
        lastErr = "Model " + model + " báo lỗi " + res.status + ".";
        break;
      }
      const j = await res.json();
      const cand = (j.candidates || [])[0] || {};
      return ((cand.content || {}).parts || []).map(p => p.text || "").join("").trim();
    }
  }
  if (sawBusy) throw new Error("Tất cả các model AI đều đang bận hoặc hết lượt miễn phí tạm thời (Google quá tải). Bạn chờ 1-2 phút rồi bấm thử lại nhé.");
  throw new Error(lastErr || "Không gọi được AI lúc này. Hãy thử lại sau.");
}
/* Groq dự phòng (v2.30): API kiểu OpenAI, có model đọc được ảnh.
   Khi Gemini lỗi tạm thời thì aiCall tự chuyển qua đây. */
const GROQ_MODELS = ["meta-llama/llama-4-scout-17b-16e-instruct", "meta-llama/llama-4-maverick-17b-128e-instruct", "qwen/qwen3.8-27b", "openai/gpt-oss-120b"];
async function groqCall(parts, temperature) {
  const key = groqKey();
  if (!key) throw new Error("Chưa nhập khóa Groq trên máy này. Hãy vào mục Dữ liệu để dán khóa Groq.");
  const hasImage = parts.some(p => p.inline_data);
  const content = parts.map(p => p.text ? { type: "text", text: p.text } : { type: "image_url", image_url: { url: "data:" + (p.inline_data.mime_type || "image/jpeg") + ";base64," + p.inline_data.data } });
  let lastErr = "", sawBusy = false;
  for (const model of GROQ_MODELS) {
    if (hasImage && /qwen|gpt-oss/.test(model)) continue;
    for (let attempt = 0; attempt < 2; attempt++) {
      let res;
      try {
        res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
          body: JSON.stringify({ model, messages: [{ role: "user", content }], temperature })
        });
      } catch (e) { lastErr = "Không gọi được Groq, hãy kiểm tra mạng."; break; }
      if (!res.ok) {
        if (res.status === 401) throw new Error("Khóa Groq không đúng. Hãy kiểm tra lại khóa Groq ở mục Dữ liệu.");
        if (res.status === 429 || res.status === 503) { sawBusy = true; lastErr = "Model Groq " + model + " đang bận (" + res.status + ")."; if (attempt === 0) { await aiSleep(3000); continue; } break; }
        lastErr = "Model Groq " + model + " báo lỗi " + res.status + ".";
        break;
      }
      const j = await res.json();
      const txt = (((j.choices || [])[0] || {}).message || {}).content || "";
      if (String(txt).trim()) return String(txt).trim();
      lastErr = "Groq trả về nội dung rỗng.";
      break;
    }
  }
  if (sawBusy) throw new Error("Cả Gemini và Groq đều đang bận tạm thời. Bạn chờ 1-2 phút rồi bấm thử lại nhé.");
  throw new Error(lastErr || "Không gọi được Groq lúc này.");
}
/* Cửa gọi AI chung: Gemini trước, lỗi tạm thời thì tự qua Groq dự phòng.
   Khóa Gemini sai thì báo thẳng, không qua Groq (tránh khó hiểu). */
async function aiCall(parts, temperature) {
  if (geminiKey()) {
    try { return await geminiCall(parts, temperature); }
    catch (e) {
      if (/Khóa Gemini không đúng|bị từ chối quyền/.test(e.message || "") || !groqKey()) throw e;
    }
  }
  if (groqKey()) return await groqCall(parts, temperature);
  throw new Error("Chưa nhập khóa AI trên máy này. Hãy vào mục Dữ liệu để dán khóa Gemini (hoặc khóa Groq dự phòng).");
}
function parseAiJson(text) {
  const t = String(text || "").trim().replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");

    const a = t.indexOf("{"), b = t.lastIndexOf("}");
    if (a >= 0 && b > a) return JSON.parse(t.slice(a, b + 1));
    throw e;
  }
}

/* ---------- Tìm sản phẩm tương tự theo thành phần (v2.27) ----------
   Lớp 1: so trong Kho nội bộ bằng cách tách các chất + hàm lượng khỏi
   ô Thành phần (chữ tự do) rồi chấm điểm giống nhau.
   Lớp 2: hỏi Gemini gợi ý sản phẩm ngoài thị trường (tham khảo). */
const COMP_KEYS = { n: "N", dam: "N", p2o5: "P2O5", lan: "P2O5", k2o: "K2O", kali: "K2O", ca: "Ca", canxi: "Ca", cao: "CaO", mg: "Mg", magie: "Mg", mgo: "MgO", s: "S", b: "B", bo: "B", zn: "Zn", kem: "Zn", fe: "Fe", sat: "Fe", cu: "Cu", dong: "Cu", mn: "Mn", mangan: "Mn", mo: "Mo", si: "Si", sio2: "SiO2", naa: "NAA", ga3: "GA3" };
const COMP_MICROS = ["Ca", "CaO", "Mg", "MgO", "S", "B", "Zn", "Fe", "Cu", "Mn", "Mo", "Si", "SiO2"];
function compWeight(k) {
  if (k === "N" || k === "P2O5" || k === "K2O") return 3;
  if (COMP_MICROS.includes(k)) return 1.5;
  return 2.5;
}
function parseComponents(text) {
  const out = {};
  if (!text) return out;
  const raw = String(text).replace(/₂/g, "2").replace(/₅/g, "5");
  const norm = searchKey(raw);
  const put = (key, num, unit) => {
    if (!key || !(num > 0) || (key in out)) return;
    let pct = num;
    if (unit === "ppm" || unit === "mg/kg") pct = num / 10000;
    else if (unit === "g/kg") pct = num / 10;
    out[key] = { pct, disp: fmtNumInput(num) + (unit === "%" ? "%" : unit === "ppm" ? "ppm" : unit ? " " + unit : "") };
  };
  const dash = norm.match(/(\d+(?:[.,]\d+)?)\s*-\s*(\d+(?:[.,]\d+)?)\s*-\s*(\d+(?:[.,]\d+)?)/);
  if (dash) { put("N", parseFloat(dash[1].replace(",", ".")), "%"); put("P2O5", parseFloat(dash[2].replace(",", ".")), "%"); put("K2O", parseFloat(dash[3].replace(",", ".")), "%"); }
  const re = /([a-z][a-z0-9]*)\s*[:=]?\s*(\d+(?:[.,]\d+)?)\s*(%|ppm|mg\/kg|g\/l|g\/kg)?/g;
  let m;
  while ((m = re.exec(norm))) {
    const key = COMP_KEYS[m[1]];
    if (key) put(key, parseFloat(m[2].replace(",", ".")), m[3] || "%");
  }
  const reB = /([A-Z][a-z]{3,}(?:\s[A-Z][a-z]+)?)\s+(\d+(?:[.,]\d+)?)\s*(%|ppm|g\/l)/g;
  while ((m = reB.exec(raw))) put(m[1].trim(), parseFloat(m[2].replace(",", ".")), m[3]);
  return out;
}
function similarityScore(a, b) {
  let num = 0, den = 0, shared = 0;
  for (const k of Object.keys(a)) {
    const w = compWeight(k); den += w;
    if (k in b) { shared++; const d = Math.abs(a[k].pct - b[k].pct) / Math.max(a[k].pct, b[k].pct, 1e-9); num += w * (1 - Math.min(1, d)); }
  }
  return { score: den ? num / den : 0, shared };
}

{"suggestions":[{"name":"tên sản phẩm","maker":"hãng hoặc nhà sản xuất nếu biết, không biết thì để trống","composition":"thành phần chính kèm hàm lượng","difference":"điểm khác biệt chính so với sản phẩm gốc, 1 câu ngắn"}], "equivalents":[{"title":"tên gọi dạng công thức hoặc loại sản phẩm","composition":"thành phần nên có kèm hàm lượng","note":"khi nào dùng dạng này, 1 câu ngắn"}], "search_keywords":["từ khóa tìm mua"], "buying_tips":"lưu ý khi chọn hàng thay thế"}
Quy tắc:
- suggestions: tối đa 5 sản phẩm cụ thể có tên thương mại mà bạn biết rõ là có thật trên thị trường Việt Nam và có thành phần/hoạt chất tương tự sản phẩm gốc. Không chắc chắn về một sản phẩm thì bỏ qua, KHÔNG bịa tên sản phẩm; mảng này được phép rỗng.
- equivalents: BẮT BUỘC có ít nhất 2 mục - các CÔNG THỨC tương đương về chức năng (không cần tên thương mại), suy ra từ chính thành phần sản phẩm gốc. Ví dụ với phân bón: nêu các tỷ lệ N - P2O5 - K2O tương đương cho cùng công dụng, kèm vi lượng và chất điều hòa sinh trưởng cần có; với thuốc bảo vệ thực vật: nêu hoạt chất cùng nhóm tác động có thể thay thế và nồng độ tương đương.
- search_keywords: 3-5 từ khóa ngắn, thực tế, để nông dân gõ tìm mua trên Shopee hoặc hỏi cửa hàng vật tư (gồm cả từ khóa theo công thức, ví dụ "phân bón lá 10-33-20").
- buying_tips: 1-2 câu lưu ý khi chọn hàng thay thế: cần so hàm lượng gì, tránh nhầm lẫn gì.
- Không nêu giá tiền.`;
  const text = await aiCall([{ text: prompt }], 0.2);
  let obj;
  try { obj = parseAiJson(text); } catch (e) { throw new Error("AI trả về định dạng lạ, hãy bấm thử lại."); }
  const clean = (arr, fields) => (Array.isArray(arr) ? arr : []).filter(x => x && typeof x === "object" && fields.some(f => x[f])).slice(0, 5);
  return {
    suggestions: clean(obj.suggestions, ["name"]),
    equivalents: clean(obj.equivalents, ["title", "composition"]),
    search_keywords: (Array.isArray(obj.search_keywords) ? obj.search_keywords : []).filter(x => typeof x === "string" && x.trim()).slice(0, 5),
    buying_tips: typeof obj.buying_tips === "string" ? obj.buying_tips : ""
  };
}

/* ===== Thời tiết ở dải ngang (Open-Meteo, miễn phí, không cần khóa) ===== */
function weatherLoc() { try { return JSON.parse(localStorage.getItem("tachi_weather_loc") || "null"); } catch { return null; } }
const WMO_VN = { 0: "Trời quang", 1: "Ít mây", 2: "Mây rải rác", 3: "Nhiều mây", 45: "Sương mù", 48: "Sương mù", 51: "Mưa phùn nhẹ", 53: "Mưa phùn", 55: "Mưa phùn dày", 61: "Mưa nhẹ", 63: "Mưa vừa", 65: "Mưa to", 66: "Mưa băng nhẹ", 67: "Mưa băng", 71: "Tuyết nhẹ", 73: "Tuyết vừa", 75: "Tuyết dày", 80: "Mưa rào nhẹ", 81: "Mưa rào", 82: "Mưa rào mạnh", 95: "Dông", 96: "Dông kèm mưa đá nhẹ", 99: "Dông kèm mưa đá" };
function wmoIcon(code) { if (code === 0) return "☀️"; if (code <= 2) return "🌤️"; if (code === 3) return "☁️"; if (code === 45 || code === 48) return "🌫️"; if (code >= 95) return "⛈️"; if (code >= 80) return "🌦️"; if (code >= 51) return "🌧️"; return "🌡️"; }
let weatherTimer = null;
function initWeather() { renderWeatherBar(); if (weatherTimer) clearInterval(weatherTimer); weatherTimer = setInterval(renderWeatherBar, 30 * 60 * 1000); }
async function renderWeatherBar() {
  const bar = document.getElementById("weatherBar"); if (!bar) return;
  const loc = weatherLoc();
  if (!loc) { bar.style.display = "none"; return; }
  try {
    let data = null;
    const cacheRaw = localStorage.getItem("tachi_weather_cache");
    if (cacheRaw) { const c = JSON.parse(cacheRaw); if (Date.now() - c.ts < 30 * 60 * 1000 && c.key === loc.lat + "," + loc.lon) data = c.data; }
    if (!data) {
      const url = "https://api.open-meteo.com/v1/forecast?latitude=" + loc.lat + "&longitude=" + loc.lon + "&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&timezone=auto&forecast_days=4";
      const res = await fetch(url); if (!res.ok) throw new Error("wx " + res.status);
      data = await res.json();
      localStorage.setItem("tachi_weather_cache", JSON.stringify({ ts: Date.now(), key: loc.lat + "," + loc.lon, data }));
    }
    const cur = data.current, d = data.daily;
    const rain0 = d.precipitation_probability_max && d.precipitation_probability_max[0] != null ? " · khả năng mưa " + d.precipitation_probability_max[0] + "%" : "";
    const days = d.time.map((t, i) => i === 0 ? "" : `<span style="margin-left:16px">${wmoIcon(d.weather_code[i])} ${fmtDate(t)}: <b>${Math.round(d.temperature_2m_min[i])}°-${Math.round(d.temperature_2m_max[i])}°</b>${d.precipitation_probability_max && d.precipitation_probability_max[i] != null ? " · mưa " + d.precipitation_probability_max[i] + "%" : ""}</span>`).join("");
    bar.innerHTML = `<div style="max-width:1360px;margin:0 auto"><span>${wmoIcon(cur.weather_code)} <b>${esc(loc.name || "Vườn")}</b>: ${WMO_VN[cur.weather_code] || ""}, <b>${Math.round(cur.temperature_2m)}°C</b></span><span style="margin-left:16px">Hôm nay: <b>${Math.round(d.temperature_2m_min[0])}°-${Math.round(d.temperature_2m_max[0])}°</b>${rain0}</span>${days}</div>`;
    bar.style.display = "";
  } catch { bar.style.display = "none"; }
}
function weatherCardHTML() {
  const loc = weatherLoc();
  return `<div class="card"><h2>🌦️ Vị trí vườn cho dự báo thời tiết</h2>
    <p class="note">Đặt vị trí vườn để dải ngang phía trên app hiện dự báo thời tiết (nguồn Open-Meteo, miễn phí, chỉ hiện khi có mạng). ${loc ? "Đang đặt: <b>" + esc(loc.name || "") + "</b> (" + loc.lat + ", " + loc.lon + ")." : "Chưa đặt vị trí nên dải thời tiết đang ẩn."}</p><br>
    <div class="field"><label>Tên nơi (xã / huyện / tỉnh)</label><input id="wxName" value="${loc ? esc(loc.name || "") : ""}" placeholder="VD: Ea Kar, Đắk Lắk"></div>
    <div class="field"><label>Vĩ độ (lat)</label><input id="wxLat" value="${loc ? loc.lat : ""}" placeholder="VD: 12.6797"></div>
    <div class="field"><label>Kinh độ (lon)</label><input id="wxLon" value="${loc ? loc.lon : ""}" placeholder="VD: 108.0447"></div>
    <button class="btn" onclick="saveWeatherLoc()">Lưu vị trí</button>
    <button class="btn secondary" onclick="geoWeatherLoc()">📍 Lấy vị trí của máy này</button>
    ${loc ? `<button class="btn danger" onclick="clearWeatherLoc()">Tắt thời tiết</button>` : ""}
    <p class="note" style="margin-top:8px">Mẹo lấy tọa độ: mở Google Maps, chạm giữ vào vị trí vườn, cặp số hiện ra chính là vĩ độ, kinh độ.</p></div>`;
}
function saveWeatherLoc() {
  const name = document.getElementById("wxName").value.trim();
  const lat = parseFloat(document.getElementById("wxLat").value);
  const lon = parseFloat(document.getElementById("wxLon").value);
  if (isNaN(lat) || isNaN(lon)) { alert("Hãy nhập vĩ độ và kinh độ dạng số, ví dụ 12.6797 và 108.0447."); return; }
  localStorage.setItem("tachi_weather_loc", JSON.stringify({ name, lat, lon }));
  localStorage.removeItem("tachi_weather_cache");
  renderWeatherBar(); render();
}
function geoWeatherLoc() {
  if (!navigator.geolocation) { alert("Máy này không hỗ trợ định vị."); return; }
  navigator.geolocation.getCurrentPosition(p => {
    document.getElementById("wxLat").value = p.coords.latitude.toFixed(5);
    document.getElementById("wxLon").value = p.coords.longitude.toFixed(5);
    alert("Đã lấy tọa độ của máy. Bấm Lưu vị trí để áp dụng.");
  }, () => alert("Không lấy được vị trí. Hãy nhập tay tọa độ lấy từ Google Maps."));
}
function clearWeatherLoc() { localStorage.removeItem("tachi_weather_loc"); renderWeatherBar(); render(); }

FarmDB.open().then(async () => {
  if (!localStorage.getItem("farm_crops_seeded_v2")) {
    const existing = await FarmDB.all("crops");
    if (!existing.length) {
      const preset = [
        { name: "Hồ tiêu", group: "Cây lâu năm", unit: "trụ", notes: "" },
        { name: "Cà phê", group: "Cây lâu năm", unit: "cây", notes: "" },
        { name: "Vải thiều", group: "Cây lâu năm", unit: "cây", notes: "" },
        { name: "Sầu riêng", group: "Cây lâu năm", unit: "cây", notes: "" },
        { name: "Chuối", group: "Cây lâu năm", unit: "bụi", notes: "" },
        { name: "Bắp (ngô)", group: "Cây ngắn ngày (hoa màu)", unit: "luống", notes: "" },
        { name: "Khoai mì (sắn)", group: "Cây ngắn ngày (hoa màu)", unit: "luống", notes: "" },
        { name: "Rau các loại", group: "Cây ngắn ngày (hoa màu)", unit: "luống", notes: "" }
      ];
      for (const c of preset) await FarmDB.put("crops", c);
    }
    localStorage.setItem("farm_crops_seeded_v2", "1");
  }
  if (!localStorage.getItem("farm_tasks_merged_v4")) {
    const oldTasks = await FarmDB.all("tasks");
    if (oldTasks.length) {
      const allPlantings = await FarmDB.all("plantings");
      for (const t of oldTasks) {
        const pl = t.planting_id ? allPlantings.find(x => x.id === t.planting_id) : null;
        await FarmDB.put("care_logs", { date: t.date || todayStr(), zone_id: pl ? pl.zone_id : "", planting_id: t.planting_id || "", activity: t.title || t.type || "Việc cần làm", materials: [], cost_amount: 0, notes: t.notes || "", status: t.status === "Đã xong" ? "Đã làm" : "Cần làm" });
        await FarmDB.remove("tasks", t.id);
      }
    }
    localStorage.setItem("farm_tasks_merged_v4", "1");
  }
  const badge = document.getElementById("appBadge");
  if (badge) badge.textContent = APP_VERSION;
  renderNav(); render(); setSyncStatus(); initWeather();
  if (Cloud.ready()) syncNow(false);
}).catch(() => {
  $app.innerHTML = `<div class="empty">Trình duyệt không mở được kho dữ liệu offline (IndexedDB).<br>Hãy mở file này bằng Chrome hoặc Edge phiên bản mới, không dùng chế độ ẩn danh.</div>`;
});
